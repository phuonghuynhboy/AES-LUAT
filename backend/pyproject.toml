[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-luat-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "langchain-chroma>=0.2,<2",
  "langchain-huggingface>=0.2,<2",
  "langgraph>=0.6,<2",
  "python-dotenv>=1.0,<2",
  "rank-bm25>=0.2,<1",
  "sentence-transformers>=5.0,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: calls the real retrieval and Gemini-backed RAG pipeline",
  "evaluation: validates or runs the curated 80-100 question RAG benchmark",
]

[tool.setuptools]
packages = []
